[project]
name = "mp3-downloader"
version = "0.2.0"
description = "Interface gráfica para baixar áudio e vídeo com o yt-dlp, convertendo para MP3, FLAC, WAV, OGG ou M4A."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "pillow>=10",
    "yt-dlp>=2024.1",
]

[project.scripts]
mp3-downloader = "mp3_downloader.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
